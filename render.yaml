# Render Blueprint — https://render.com/docs/blueprint-spec
# Values marked `sync: false` are prompted for in the Render dashboard (never commit them).
services:
  - type: web
    name: nexum-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT core.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # ── Database (Supabase Postgres) ──
      - key: DB_ENGINE
        value: postgres
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

      # ── Firebase — upload firebase-adminsdk.json as a Secret File ──
      - key: FIREBASE_CREDENTIALS_PATH
        value: /etc/secrets/firebase-adminsdk.json
      - key: FIREBASE_WEB_API_KEY
        sync: false

      # ── Supabase Storage (listing + profile images) ──
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

      # ── Admin dashboard login ──
      - key: ADMIN_EMAILS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # ── Email (OTP) ──
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
